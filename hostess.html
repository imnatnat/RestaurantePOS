<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hostess — Mapa de Mesas</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 { margin-bottom: 10px; }

    .leyenda {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      align-items: center;
    }
    .leyenda span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block;
    }

    #floor {
      position: relative;
      width: 620px;
      height: 280px;
      border: 2px solid #ccc;
      border-radius: 12px;
      background: white;
    }

    .mesa {
      position: absolute;
      width: 70px;
      height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: transform 0.1s;
      user-select: none;
    }
    .mesa:hover { transform: scale(1.08); }
    .mesa small { font-size: 10px; font-weight: normal; opacity: 0.9; }

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.show { display: flex; }
    #modal {
      background: white;
      border-radius: 14px;
      padding: 24px;
      width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #modal h3 { margin: 0 0 6px; }
    #modal p  { margin: 0 0 18px; color: #555; font-size: 14px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn-group button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      color: white;
    }
    .btn-sentar   { background: #e53935; }
    .btn-limpiar  { background: #fb8c00; }
    .btn-liberar  { background: #43a047; }
    .btn-orden    { background: #1e88e5; }
    .btn-cancelar { background: #aaa; }
    .btn-group button:hover { opacity: 0.85; }

    #reload-btn {
      margin-top: 16px;
      padding: 8px 18px;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    #reload-btn:hover { background: #555; }
  </style>
</head>
<body>

<h2>🍽️ Mapa de Mesas</h2>

<div class="leyenda">
  <span><span class="dot" style="background:#43a047"></span> Disponible</span>
  <span><span class="dot" style="background:#e53935"></span> Ocupada</span>
  <span><span class="dot" style="background:#fb8c00"></span> Limpieza</span>
  <span><span class="dot" style="background:#8e24aa"></span> Reservada</span>
</div>

<div id="floor"></div>

<button id="reload-btn">🔄 Actualizar mesas</button>

<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-titulo">Mesa X</h3>
    <p id="modal-estado">Estado: —</p>
    <div class="btn-group">
      <button class="btn-sentar"   onclick="accion('occupied')">🪑 Sentar comensales</button>
      <button class="btn-limpiar"  onclick="accion('cleaning')">🧹 Marcar para limpieza</button>
      <button class="btn-liberar"  onclick="accion('available')">✅ Liberar mesa</button>
      <button class="btn-orden"    onclick="irAOrden()">📋 Ir a tomar orden</button>
      <button class="btn-cancelar" onclick="cerrarModal()">✖ Cancelar</button>
    </div>
  </div>
</div>

<!-- ✅ Firebase directo — sin backend -->
<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCLPsPBZqgap4goUqUI6YW6iX7fdUVeAhQ",
    authDomain:        "restaurantepos-5cabe.firebaseapp.com",
    projectId:         "restaurantepos-5cabe",
    storageBucket:     "restaurantepos-5cabe.firebasestorage.app",
    messagingSenderId: "1009629175685",
    appId:             "1:1009629175685:web:63ef1d29b4ce1f36e1eeec"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  // Posiciones en el mapa (igual que antes)
  const posiciones = {
    1:{x:30,y:30}, 2:{x:120,y:30}, 3:{x:210,y:30}, 4:{x:300,y:30},
    5:{x:390,y:30}, 6:{x:480,y:30}, 7:{x:30,y:150}, 8:{x:120,y:150},
    9:{x:210,y:150}, 10:{x:300,y:150}, 11:{x:390,y:150}, 12:{x:480,y:150}
  };

  const statusColor = {
    available: "#43a047",
    occupied:  "#e53935",
    cleaning:  "#fb8c00",
    reserved:  "#8e24aa",
  };
  const statusLabel = {
    available: "Disponible",
    occupied:  "Ocupada",
    cleaning:  "Limpieza",
    reserved:  "Reservada",
  };

  let mesaSeleccionada = null;

  // ── Escucha cambios en tiempo real ───────────────────────
  onSnapshot(collection(db, "tables"), (snapshot) => {
    const floor = document.getElementById("floor");
    floor.innerHTML = "";

    const tables = [];
    snapshot.forEach(d => tables.push({ id: d.id, ...d.data() }));
    tables.sort((a, b) => Number(a.number) - Number(b.number));

    tables.forEach(t => {
      const num    = Number(t.number);
      const status = t.status ?? "available";
      const pos    = posiciones[num] || { x: 0, y: 0 };

      const d = document.createElement("div");
      d.className = "mesa";
      d.innerHTML = `<span>Mesa ${num}</span><small>${statusLabel[status] ?? status}</small>`;
      d.style.left       = pos.x + "px";
      d.style.top        = pos.y + "px";
      d.style.background = statusColor[status] ?? "#757575";
      d.onclick = () => abrirModal(t);
      floor.appendChild(d);
    });
  });

  // ── Modal ────────────────────────────────────────────────
  function abrirModal(mesa) {
    mesaSeleccionada = mesa;
    const status = mesa.status ?? "available";
    document.getElementById("modal-titulo").textContent = `Mesa ${mesa.number}`;
    document.getElementById("modal-estado").textContent = `Estado actual: ${statusLabel[status] ?? status}`;
    document.getElementById("modal-overlay").classList.add("show");
  }

  window.cerrarModal = () => {
    document.getElementById("modal-overlay").classList.remove("show");
    mesaSeleccionada = null;
  };

  document.getElementById("modal-overlay").addEventListener("click", e => {
    if (e.target === document.getElementById("modal-overlay")) window.cerrarModal();
  });

  // ── Cambia estado en Firestore ───────────────────────────
  window.accion = async (nuevoStatus) => {
    if (!mesaSeleccionada) return;
    try {
      await updateDoc(doc(db, "tables", mesaSeleccionada.id), { status: nuevoStatus });
      window.cerrarModal();
      // onSnapshot actualiza los colores automáticamente ✅
    } catch (err) {
      alert("Error al cambiar estado: " + err.message);
    }
  };

  window.irAOrden = () => {
    if (!mesaSeleccionada) return;
    window.location.href = `server.html?mesa=${mesaSeleccionada.id}`;
  };

  // Botón de actualizar (aunque onSnapshot ya es automático)
  document.getElementById("reload-btn").onclick = () => {
    alert("Las mesas se actualizan automáticamente en tiempo real 🔄");
  };
</script>

</body>
</html>
