<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hostess — Mapa de Mesas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
    }

    h1 { font-size: 22px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Floor map */
    #floor {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #16213e;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 30px;
      max-width: 720px;
    }

    .mesa {
      width: 80px; height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: transform 0.15s;
      user-select: none;
    }
    .mesa:hover { transform: scale(1.1); }
    .mesa small {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Modal */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.show { display: flex; }
    #modal {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      padding: 28px;
      width: 320px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    #modal h3 { margin-bottom: 4px; font-size: 20px; }
    #modal p  { margin-bottom: 20px; color: #aaa; font-size: 14px; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn-group button {
      padding: 11px;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      color: white;
    }
    .btn-group button:hover { opacity: 0.82; }
    .btn-seat    { background: #e53935; }
    .btn-clean   { background: #fb8c00; }
    .btn-free    { background: #43a047; }
    .btn-reserve { background: #8e24aa; }
    .btn-cancel  { background: #555; }

    /* Reservations */
    #reservaciones { max-width: 720px; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      font-size: 14px;
    }
    th {
      background: #0f3460;
      padding: 10px 14px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
    }
    td { padding: 10px 14px; border-bottom: 1px solid #1a1a2e; }
    tr:last-child td { border-bottom: none; }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-pending   { background: #fb8c0033; color: #fb8c00; }
    .badge-confirmed { background: #43a04733; color: #43a047; }
    .badge-seated    { background: #e5393533; color: #e53935; }
    .badge-cancelled { background: #55555533; color: #aaa; }

    .btn-confirm-res {
      background: #43a047;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-confirm-res:hover { opacity: 0.8; }
  </style>
</head>
<body>

<h1>🍽️ Hostess — Panel de Mesas</h1>

<div class="legend">
  <span><span class="dot" style="background:#43a047"></span> Disponible</span>
  <span><span class="dot" style="background:#e53935"></span> Ocupada</span>
  <span><span class="dot" style="background:#fb8c00"></span> Limpieza</span>
  <span><span class="dot" style="background:#8e24aa"></span> Reservada</span>
</div>

<div id="floor"><p style="color:#aaa">Cargando mesas...</p></div>

<div id="reservaciones">
  <h2>📋 Reservaciones</h2>
  <table>
    <thead>
      <tr>
        <th>Nombre</th><th>Hora</th><th>Pax</th>
        <th>Mesa</th><th>Nota</th><th>Status</th><th>Acción</th>
      </tr>
    </thead>
    <tbody id="res-body">
      <tr><td colspan="7" style="color:#aaa">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Mesa X</h3>
    <p id="modal-status">Estado: —</p>
    <div class="btn-group">
      <button class="btn-seat"    onclick="changeStatus('occupied')">🪑 Sentar comensales</button>
      <button class="btn-clean"   onclick="changeStatus('cleaning')">🧹 Marcar para limpieza</button>
      <button class="btn-free"    onclick="changeStatus('available')">✅ Liberar mesa</button>
      <button class="btn-reserve" onclick="changeStatus('reserved')">📅 Marcar como reservada</button>
      <button class="btn-cancel"  onclick="closeModal()">✖ Cancelar</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCLPsPBZqgap4goUqUI6YW6iX7fdUVeAhQ",
    authDomain:        "restaurantepos-5cabe.firebaseapp.com",
    projectId:         "restaurantepos-5cabe",
    storageBucket:     "restaurantepos-5cabe.firebasestorage.app",
    messagingSenderId: "1009629175685",
    appId:             "1:1009629175685:web:63ef1d29b4ce1f36e1eeec"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  const statusColor = {
    available: "#43a047",
    occupied:  "#e53935",
    cleaning:  "#fb8c00",
    reserved:  "#8e24aa",
  };
  const statusLabel = {
    available: "Disponible",
    occupied:  "Ocupada",
    cleaning:  "Limpieza",
    reserved:  "Reservada",
  };

  let selected = null;

  // ── Tables (real-time) ───────────────────────────────────
  onSnapshot(collection(db, "tables"), (snapshot) => {
    const floor = document.getElementById("floor");
    floor.innerHTML = "";

    const tables = [];
    snapshot.forEach(d => tables.push({ id: d.id, ...d.data() }));
    tables.sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0));

    if (tables.length === 0) {
      floor.innerHTML = `<p style="color:#aaa">No hay mesas en Firestore.</p>`;
      return;
    }

    tables.forEach(t => {
      const status = t.status ?? "available";
      const div = document.createElement("div");
      div.className = "mesa";
      div.style.background = statusColor[status] ?? "#555";
      div.innerHTML = `<span>Mesa ${t.number ?? t.id}</span><small>${statusLabel[status] ?? status}</small>`;
      div.onclick = () => openModal(t);
      floor.appendChild(div);
    });
  });

  // ── Reservations (real-time) ─────────────────────────────
  onSnapshot(collection(db, "reservations"), (snapshot) => {
    const tbody = document.getElementById("res-body");
    tbody.innerHTML = "";

    const list = [];
    snapshot.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (a.time ?? "").localeCompare(b.time ?? ""));

    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="color:#aaa">No hay reservaciones</td></tr>`;
      return;
    }

    list.forEach(r => {
      const badgeClass = {
        pending:   "badge-pending",
        confirmed: "badge-confirmed",
        seated:    "badge-seated",
        cancelled: "badge-cancelled",
      }[r.status] ?? "badge-pending";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.name  ?? "—"}</td>
        <td>${r.time  ?? "—"}</td>
        <td>${r.pax   ?? "—"}</td>
        <td>${r.table ?? "TBD"}</td>
        <td>${r.note  ?? ""}</td>
        <td><span class="badge ${badgeClass}">${r.status ?? "pending"}</span></td>
        <td>${r.status === "pending"
          ? `<button class="btn-confirm-res" onclick="confirmRes('${r.id}')">Confirmar</button>`
          : "—"}</td>
      `;
      tbody.appendChild(tr);
    });
  });

  // ── Modal ────────────────────────────────────────────────
  function openModal(table) {
    selected = table;
    const status = table.status ?? "available";
    document.getElementById("modal-title").textContent  = `Mesa ${table.number ?? table.id}`;
    document.getElementById("modal-status").textContent = `Estado actual: ${statusLabel[status] ?? status}`;
    document.getElementById("modal-overlay").classList.add("show");
  }

  window.closeModal = () => {
    document.getElementById("modal-overlay").classList.remove("show");
    selected = null;
  };

  document.getElementById("modal-overlay").addEventListener("click", e => {
    if (e.target === document.getElementById("modal-overlay")) window.closeModal();
  });

  window.changeStatus = async (newStatus) => {
    if (!selected) return;
    try {
      await updateDoc(doc(db, "tables", selected.id), { status: newStatus });
      window.closeModal();
    } catch (err) {
      alert("Error cambiando estado: " + err.message);
    }
  };

  window.confirmRes = async (id) => {
    try {
      await updateDoc(doc(db, "reservations", id), { status: "confirmed" });
    } catch (err) {
      alert("Error confirmando reservación: " + err.message);
    }
  };
</script>

</body>
</html>
